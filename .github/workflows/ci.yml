name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      - run: mvn -B verify
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: akegp-web/package-lock.json }
      - run: npm ci
        working-directory: akegp-web
      - run: npm run build
        working-directory: akegp-web
