services:
  app:
    build: { context: ., dockerfile: akegp-app/Dockerfile }
    environment:
      NEO4J_URI: ${NEO4J_URI:?Set NEO4J_URI to your Neo4j Aura connection URI}
      NEO4J_USER: ${NEO4J_USER:?Set NEO4J_USER to your Neo4j Aura username}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD to your Neo4j Aura password}
      AKEGP_DB_URL: ${AKEGP_DB_URL:?Set AKEGP_DB_URL to your enforcement PostgreSQL JDBC URL}
      AKEGP_DB_USER: ${AKEGP_DB_USER:?Set AKEGP_DB_USER}
      AKEGP_DB_PASSWORD: ${AKEGP_DB_PASSWORD:?Set AKEGP_DB_PASSWORD}
      AKEGP_RULES_DB_URL: ${AKEGP_RULES_DB_URL:?Set AKEGP_RULES_DB_URL to your Neon PostgreSQL JDBC URL}
      AKEGP_RULES_DB_USER: ${AKEGP_RULES_DB_USER:?Set AKEGP_RULES_DB_USER to your Neon PostgreSQL username}
      AKEGP_RULES_DB_PASSWORD: ${AKEGP_RULES_DB_PASSWORD:?Set AKEGP_RULES_DB_PASSWORD to your Neon PostgreSQL password}
      AKEGP_ANALYTICS_DB_URL: ${AKEGP_ANALYTICS_DB_URL:-}
      AKEGP_ANALYTICS_DB_USER: ${AKEGP_ANALYTICS_DB_USER:-}
      AKEGP_ANALYTICS_DB_PASSWORD: ${AKEGP_ANALYTICS_DB_PASSWORD:-}
      AKEGP_USERS_DB_URL: ${AKEGP_USERS_DB_URL:-${AKEGP_RULES_DB_URL}}
      AKEGP_USERS_DB_USER: ${AKEGP_USERS_DB_USER:-${AKEGP_RULES_DB_USER}}
      AKEGP_USERS_DB_PASSWORD: ${AKEGP_USERS_DB_PASSWORD:-${AKEGP_RULES_DB_PASSWORD}}
      AKEGP_JWT_SECRET: ${AKEGP_JWT_SECRET:?Set AKEGP_JWT_SECRET to a Base64 signing key of at least 32 bytes}
      AKEGP_FRONTEND_URL: ${AKEGP_FRONTEND_URL:-http://localhost:5173}
      AKEGP_SECURE_COOKIE: ${AKEGP_SECURE_COOKIE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Optional server-to-server publisher; empty means recorded snapshot ingress is disabled.
      AKEGP_ANALYTICS_INGESTION_KEY: ${AKEGP_ANALYTICS_INGESTION_KEY:-}
      # Optional synthetic analytics fixtures; workspace membership remains enforced.
      AKEGP_ANALYTICS_DEVELOPMENT_ACCESS: ${AKEGP_ANALYTICS_DEVELOPMENT_ACCESS:-false}
      AKEGP_ANALYTICS_DEMO_ENABLED: ${AKEGP_ANALYTICS_DEMO_ENABLED:-false}
    ports: ["8080:8080"]
  web:
    build: { context: akegp-web }
    depends_on: [app]
    environment:
      BACKEND_URL: http://app:8080
    ports: ["5173:5173"]
