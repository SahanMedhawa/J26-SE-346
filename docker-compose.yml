services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment: { POSTGRES_DB: akegp, POSTGRES_USER: akegp, POSTGRES_PASSWORD: akegp }
    ports: ["5432:5432"]
  neo4j:
    image: neo4j:5
    environment: { NEO4J_AUTH: neo4j/akegp-dev }
    ports: ["7474:7474", "7687:7687"]
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
  app:
    build: { context: ., dockerfile: akegp-app/Dockerfile }
    depends_on: [timescaledb, neo4j, mongodb]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: akegp-dev
      AKEGP_DB_URL: ${AKEGP_DB_URL:-jdbc:postgresql://timescaledb:5432/akegp}
      AKEGP_DB_USER: ${AKEGP_DB_USER:-akegp}
      AKEGP_DB_PASSWORD: ${AKEGP_DB_PASSWORD:-akegp}
      AKEGP_RULES_DB_URL: ${AKEGP_RULES_DB_URL:-jdbc:postgresql://timescaledb:5432/akegp}
      AKEGP_RULES_DB_USER: ${AKEGP_RULES_DB_USER:-akegp}
      AKEGP_RULES_DB_PASSWORD: ${AKEGP_RULES_DB_PASSWORD:-akegp}

    ports: ["8080:8080"]
  web:
    build: { context: akegp-web }
    depends_on: [app]
    ports: ["5173:5173"]
