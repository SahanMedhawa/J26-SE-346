spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: akegp
  datasource:
    url: ${AKEGP_DB_URL:jdbc:postgresql://localhost:5432/akegp}
    username: ${AKEGP_DB_USER:akegp}
    password: ${AKEGP_DB_PASSWORD:akegp}
  flyway:
    enabled: false
akegp:
  schemas:
    rules: rules_
    enforcement: enf_
    analytics: analytics_
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    username: ${NEO4J_USER:neo4j}
    password: ${NEO4J_PASSWORD:akegp-dev}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/akegp}
